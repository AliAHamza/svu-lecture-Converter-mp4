/* Layout: a deep-green header band with a gold rule, one working panel below it. Type: Cairo throughout. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --surface2:#E9EFEA; --ink:#112A20; --muted:#52695D; --line:#CBD8CF;
  --head:#0B3B2B; --head-ink:#F7EDCB; --green:#0F5B3E; --green-ink:#FFFFFF; --gold:#C9A24B; --gold-ink:#1B2A1F; --gold-text:#8A6414;
  --bad:#A8281F; --warn-bg:#FBF1D4; --warn-ink:#6E4F0E; --focus:#B8892A;
  --font:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08130F; --surface:#0F211A; --surface2:#16302A; --ink:#E7EFEA; --muted:#9BB3A6; --line:#24413A;
  --head:#06251B; --head-ink:#F2E3B5; --green:#2E8E63; --green-ink:#04170F; --gold:#D8B45F; --gold-ink:#17240F; --gold-text:#E0BE6A;
  --bad:#FF8F85; --warn-bg:#33290F; --warn-ink:#F0C36A; --focus:#D8B45F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08130F; --surface:#0F211A; --surface2:#16302A; --ink:#E7EFEA; --muted:#9BB3A6; --line:#24413A;
  --head:#06251B; --head-ink:#F2E3B5; --green:#2E8E63; --green-ink:#04170F; --gold:#D8B45F; --gold-ink:#17240F; --gold-text:#E0BE6A;
  --bad:#FF8F85; --warn-bg:#33290F; --warn-ink:#F0C36A; --focus:#D8B45F; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%;max-inline-size:100%;overflow-x:hidden}
body{direction:rtl;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:clamp(15px,1.5vw + 11px,18px);line-height:1.7;
  padding-left:0;padding-right:0}
.wrap{width:100%;max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--head);
  border-bottom:3px solid var(--gold);color:var(--head-ink)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-block:clamp(14px,3vw,24px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
h1{font-size:clamp(1.05rem,2.6vw + .4rem,1.65rem);line-height:1.35;margin:0;font-weight:800;text-wrap:balance;color:var(--head-ink)}
.icon-btn{flex:none;inline-size:42px;block-size:42px;display:grid;place-items:center;padding:0;border-radius:50%;background:transparent;color:var(--head-ink);border:1.5px solid rgba(201,162,75,.7);cursor:pointer}
.icon-btn:hover{background:rgba(201,162,75,.18)}
.icon-btn svg{inline-size:20px;block-size:20px}
.icon-btn .sun{display:none}
:root[data-theme="dark"] .icon-btn .sun{display:block}
:root[data-theme="dark"] .icon-btn .moon{display:none}

main{padding-block:clamp(18px,4vw,36px) clamp(32px,6vw,64px)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,3.2vw,28px);display:flex;flex-direction:column;gap:clamp(14px,2.4vw,22px);min-width:0}
.drop{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;border:2px dashed var(--line);border-radius:12px;
  padding:clamp(22px,5vw,44px) 16px;cursor:pointer;background:var(--surface2);transition:border-color .15s,background .15s;min-width:0}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--gold)}
.drop input{position:absolute;inline-size:1px;block-size:1px;opacity:0}
.drop svg{flex:none;inline-size:clamp(28px,5vw,38px);block-size:auto;color:var(--gold-text)}
.drop span{font-weight:700;font-size:1.05em;overflow-wrap:anywhere;min-width:0}
.drop.has span{font-family:ui-monospace,Consolas,monospace;font-weight:500;font-size:.92em;direction:ltr}
body[data-state="busy"] .drop,body[data-state="loading"] .drop{opacity:.6;cursor:not-allowed}

.file{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
.file[hidden]{display:none}
@media (min-width:760px){.file{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
canvas#view{inline-size:100%;block-size:auto;aspect-ratio:1088/666;border:1px solid var(--line);border-radius:10px;background:#fff;display:block}
dl.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
dl.chips div{background:var(--surface2);border-radius:10px;padding:10px 14px;min-width:0}
dl.chips dt{font-size:.78em;color:var(--muted);line-height:1.4}
dl.chips dd{margin:0;font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05em;direction:ltr;text-align:right;overflow-wrap:anywhere}

.actions{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;font-weight:700;border-radius:10px;padding:12px 26px;border:1.5px solid transparent;cursor:pointer;min-block-size:48px;flex:1 1 170px}
#go{background:var(--green);color:var(--green-ink)}
#save{background:var(--gold);color:var(--gold-ink)}
#cancel{background:transparent;color:var(--ink);border-color:var(--line);flex:0 1 auto}
button:disabled{opacity:.38;cursor:not-allowed}
button:not(:disabled):hover{filter:brightness(1.07)}
button:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.prog{display:flex;flex-direction:column;gap:8px}
.prog[hidden]{display:none}
.bar{block-size:10px;background:var(--surface2);border-radius:6px;overflow:hidden}
.bar i{display:block;block-size:100%;inline-size:0;background:var(--gold);border-radius:6px;transition:inline-size .2s}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:.88em;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:700}
.done{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--green);flex-wrap:wrap}
:root[data-theme="dark"] .done{color:var(--gold-text)}
.done svg{inline-size:22px;block-size:22px;flex:none}
.done .size{font-variant-numeric:tabular-nums;direction:ltr;color:var(--muted);font-weight:600;min-width:0;max-inline-size:100%;overflow-wrap:anywhere;word-break:break-all}
.done #saveMsg{flex:1 1 100%;text-align:start}
.done #saveMsg:empty{display:none}
.err{color:var(--bad);font-weight:600;margin:0}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 14px;font-size:.9em;margin:0}
.note[hidden],.err[hidden],.done[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.contact{display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px max(28px,env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted)}
.contact p{margin:0;font-size:.95em}
.contact .links{display:flex;gap:14px}
.contact a{display:grid;place-items:center;inline-size:48px;block-size:48px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold-text);background:var(--surface);transition:background .15s,color .15s,transform .15s}
.contact a:hover,.contact a:focus-visible{background:var(--gold);color:#112A20;transform:translateY(-2px);outline:none}
.contact svg{inline-size:24px;block-size:24px}
</style>

  let cursor=0,blocks=0;
  for(const r of arecs){
    const pl=d.subarray(r.o,r.e),off=pl[2]|pl[3]<<8;
    if(pl.length<off+21+32||pl[off]!==0x10||pl[off+1]!==0x04)continue;
    const n=Math.floor((pl.length-off-21)/32); if(n<1)continue;
    const smp=dec.decode(pl,off+21,n);
    const want=Math.max(0,Math.round((r.ts-n*30)*8));   // a packet is stamped when it ends
    if(want-cursor>2000)cursor=want;                  // silence or a pause: jump to the real time
    if(cursor+smp.length>pcm.length)break;
    for(let i=0;i<smp.length;i++)pcm[cursor+i]=smp[i]/32768;
    cursor+=smp.length;blocks+=n;
  }
  if(!blocks)return null;
  return {pcm,len:cursor,rate:8000,seconds:cursor/8000};
}
function applyUpdate(fb,W,H,u){
  for(const r of u.rects){
    const w=Math.min(r.w,W-r.x),h=Math.min(r.h,H-r.y); if(w<=0||h<=0)continue;
    for(let j=0;j<h;j++)fb.set(r.w===w?r.data.subarray(j*r.w,j*r.w+w):r.data.subarray(j*r.w,j*r.w+w),(r.y+j)*W+r.x);
  }
}

/* ---------- state & preview ---------- */
let P=null, fileName='recording', outBlob=null, cancelled=false, busy=false, previewFb=null, enhCache=null;
const BASE_TITLE=document.title;
const view=$('view'), vctx=view.getContext('2d');
function newFb(W,H,bpp){if(bpp>8){const f=new Uint32Array(W*H);f.fill(0xFF000000);return f;}return new Uint8Array(W*H);}
function drawFb(cv,ctx,fb,pal,W,H,img){
  const px=new Uint32Array(img.data.buffer);
  const ew=cv.width;
  if(fb instanceof Uint32Array){for(let y=0;y<H;y++)px.set(fb.subarray(y*W,y*W+W),y*ew);}
  else for(let y=0;y<H;y++){const a=y*W,b=y*ew;for(let x=0;x<W;x++)px[b+x]=pal[fb[a+x]];}
  ctx.putImageData(img,0,0);
}
function renderPreview(){
  if(!P||!previewFb)return;
  const ew=P.W+(P.W&1),eh=P.H+(P.H&1);
  view.width=ew;view.height=eh;
  const img=vctx.createImageData(ew,eh);new Uint32Array(img.data.buffer).fill(0xFFFFFFFF);
  drawFb(view,vctx,previewFb,PAL,P.W,P.H,img);
}
/* one place decides what is enabled: empty | loading | ready | busy | done */
function ui(state){
  document.body.dataset.state=state;
  $('go').disabled=state!=='ready';
  $('save').disabled=!(state==='done'&&outBlob);
  $('cancel').hidden=state!=='busy';
  $('file').disabled=state==='busy'||state==='loading';
  $('prog').hidden=state!=='busy';
  $('doneChip').hidden=state!=='done';
  if(state!=='busy')document.title=BASE_TITLE;
}
function setProgress(x,msg){
  const p=Math.max(0,Math.min(busy?99:100,Math.round(x*100)));
  $('bar').style.inlineSize=p+'%';$('barWrap').setAttribute('aria-valuenow',p);$('pct').textContent=p+'%';
  if(msg!==undefined)$('status').textContent=msg;
  if(busy)document.title=p+'% · '+BASE_TITLE;
}
function resetCounters(){
  setProgress(0,'');
  ['loadErr','convErr','skipNote','vpNote'].forEach(i=>{$(i).hidden=true;$(i).textContent='';});
  $('outSize').textContent='';$('saveMsg').textContent='';
}
const DROP_DEFAULT=$('dropText').textContent;
function releaseFile(){forceSoft=false;P=null;previewFb=null;enhCache=null;}

async function loadFile(f){
  if(busy)return;
  releaseFile();outBlob=null;resetCounters();ui('loading');
  fileName=f.name.replace(/\.[^.]+$/,'')||'recording';
  $('dropText').textContent=f.name;$('drop').classList.add('has');
  $('fileCard').hidden=false;
  ['iDur','iRes','iAud'].forEach(i=>$(i).textContent='...');$('iSize').textContent=fmtSize(f.size);
  try{
    const buf=await f.arrayBuffer();
    P=await parseLrec(buf,x=>{$('iDur').textContent=Math.round(x*100)+'%'});
    $('iDur').textContent=fmtTime(P.duration);
    $('iRes').textContent=P.W+' × '+P.H;
    $('iAud').textContent=P.audio?'موجود':'لا يوجد';
    if(P.skipped>0){$('skipNote').textContent='تعذّرت قراءة '+P.skipped+' عنصراً من الصورة، وقد تظهر بقايا من شرائح سابقة.';$('skipNote').hidden=false;}
    previewFb=newFb(P.W,P.H,P.bpp);
    const mid=P.duration/2;
    for(const u of P.ups){if(u.ts>mid)break;applyUpdate(previewFb,P.W,P.H,u);}
    renderPreview();
    ui('ready');
  }catch(e){
    releaseFile();
    ['iDur','iRes','iAud'].forEach(i=>$(i).textContent='-');$('fileCard').hidden=true;
    $('dropText').textContent='اختر ملف المحاضرة';$('drop').classList.remove('has');
    $('loadErr').textContent=e.message||String(e);$('loadErr').hidden=false;
    $('file').value='';ui('empty');
  }
}
$('file').addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0]);});
const drop=$('drop');
['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f&&!busy)loadFile(f);});
window.addEventListener('beforeunload',e=>{if(busy){e.preventDefault();e.returnValue='';}});
ui('empty');

/* ---------- conversion ---------- */
const IS_MOBILE=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(navigator.userAgentData&&navigator.userAgentData.mobile);
async function pickVideoConfig(ew,eh,fps,soft){
  /* returns the first supported encoder; on phones a hardware encoder is tried first, and a software encoder is kept to a smaller picture */
  const codecs=[{codec:'avc1.640034',m:'avc'},{codec:'avc1.4d0034',m:'avc'},{codec:'avc1.42003e',m:'avc'},{codec:'vp09.00.10.08',m:'vp9'}];
  const plans=[];
  if(IS_MOBILE&&!soft)plans.push({S:2,hw:'prefer-hardware',modes:['variable'],br:7e6});
  const swS=IS_MOBILE?(ew*eh*4>2.4e6?1.5:2):2;
  plans.push({S:swS,hw:'prefer-software',modes:['quantizer','variable'],br:8e5});
  for(const p of plans){
    const ow=Math.round(ew*p.S/2)*2,oh=Math.round(eh*p.S/2)*2;
    for(const t of codecs)for(const mode of p.modes){
      const cfg={codec:t.codec,width:ow,height:oh,bitrate:p.br,framerate:fps,latencyMode:'quality',bitrateMode:mode,contentHint:'detail',hardwareAcceleration:p.hw};
      try{const r=await VideoEncoder.isConfigSupported(cfg);if(r.supported)return {cfg:r.config||cfg,muxCodec:t.m,mode,ow,oh,hw:p.hw==='prefer-hardware'};}catch(e){}
    }
  }
  return null;
}
const LZ=(()=>{const N=1024,T=6,t=new Float32Array((N+1)*T);
  const L=x=>x===0?1:Math.abs(x)<3?Math.sin(Math.PI*x)*Math.sin(Math.PI*x/3)/(Math.PI*Math.PI*x*x/3):0;
  for(let f=0;f<=N;f++)for(let k=0;k<T;k++)t[f*T+k]=L(f/N-(k-2));return {N,T,t};})();
/* Lanczos resampling of one output block: returns planar Float32 (channel after channel). */
function resampleBlock(chans,srcRate,dstRate,o,n){
  const out=new Float32Array(n*chans.length),ratio=srcRate/dstRate;
  chans.forEach((ch,c)=>{
    const len=ch.length;
    for(let i=0;i<n;i++){
      const x=(o+i)*ratio,i0=Math.floor(x),fi=Math.round((x-i0)*LZ.N)*LZ.T;
      let sum=0;
      for(let k=0;k<6;k++){const idx=i0+k-2;if(idx>=0&&idx<len)sum+=ch[idx]*LZ.t[fi+k];}
      out[c*n+i]=sum;
    }
  });
  return out;
}
async function pickAudioConfig(ch,srcRate){
  const speech=srcRate<=16000;
  if('AudioEncoder' in window){
    for(const sr of speech?[16000,24000,32000,44100,48000]:[srcRate,48000,44100]){
      const cfg={codec:'mp4a.40.2',sampleRate:sr,numberOfChannels:ch,bitrate:speech?64000:128000*ch/2};
      try{const s=await AudioEncoder.isConfigSupported(cfg);if(s.supported)return {js:false,cfg:s.config||cfg,sr,channels:ch};}catch(e){}
    }
  }
  // no AAC encoder in this browser: use the built-in one (mono)
  const sr=speech?16000:(AACE.RATES.indexOf(srcRate)>=0&&srcRate>=22050?srcRate:48000);
  return {js:true,sr,channels:1,bw:speech?4400:Math.min(sr/2,16000)};
}
async function encodeAudioJs(src,ac,muxer,onP){
  const mono=src.chans.length===1?src.chans:[(()=>{const o=new Float32Array(src.len);for(const c of src.chans)for(let i=0;i<src.len;i++)o[i]+=c[i]/src.chans.length;return o;})()];
  const enc=new AACE.Encoder(ac.sr,ac.bw,0.12),F=1024,total=Math.ceil(src.len/src.rate*ac.sr)+F;
  const frames=Math.ceil(total/F);
  for(let j=0;j<frames;j++){
    if(cancelled)break;
    // the decoder delays everything by one frame, so feed the signal one frame early
    const x=resampleBlock(mono,src.rate,ac.sr,(j+1)*F,F);
    const data=enc.encode(x);
    muxer.addAudioChunkRaw(data,'key',Math.round(j*F/ac.sr*1e6),Math.round(F/ac.sr*1e6));
    if(j%200===0){onP(j/frames);await sleep(0);}
  }
}
async function encodeAudio(src,ac,muxer,onP){
  if(ac.js)return encodeAudioJs(src,ac,muxer,onP);
  let aErr=null;
  const enc=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>{aErr=e;}});
  enc.configure(ac.cfg);
  const ch=src.chans.length,total=Math.ceil(src.len/src.rate*ac.sr),step=4096;
  for(let o=0;o<total;o+=step){
    if(cancelled)break;
    if(aErr)throw aErr;
    const n=Math.min(step,total-o);
    const data=resampleBlock(src.chans,src.rate,ac.sr,o,n);
    const ad=new AudioData({format:'f32-planar',sampleRate:ac.sr,numberOfFrames:n,numberOfChannels:ch,timestamp:Math.round(o/ac.sr*1e6),data});
    enc.encode(ad);ad.close();
    await drain(enc,40);
    if((o/step)%60===0){onP(o/total);await sleep(0);}
  }
  await enc.flush();enc.close();
  if(aErr)throw aErr;
}
async function innerPcm(onP){
  const pcm=P.audio.pcm.slice(0,P.audio.len);
  await ENH.enhance(pcm,pcm.length,P.audio.rate,{denoise:18,presence:4},onP);
  return {pcm,len:pcm.length};
}
const ENH_SHARE=0.08,WAIT='الرجاء الانتظار للحظات';
let forceSoft=false,wakeLock=null;
let navLock=null,beep=null;
function keepAlive(on){
  try{
    if(on){
      if(navigator.locks&&!navLock)navigator.locks.request('svu-convert',()=>new Promise(r=>{navLock=r;})).catch(()=>{});
      if(!beep){const AC=window.AudioContext||window.webkitAudioContext;if(AC){const c=new AC(),o=c.createOscillator(),g=c.createGain();g.gain.value=0.0001;o.frequency.value=30;o.connect(g);g.connect(c.destination);o.start();beep=c;}}
      if(beep&&beep.state==='suspended')beep.resume();
      if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:'جارٍ التحويل'});}
    }else{
      if(navLock){navLock();navLock=null;}
      if(beep){beep.close();beep=null;}
      if('mediaSession' in navigator)navigator.mediaSession.metadata=null;
    }
  }catch(e){}
}
async function keepAwake(on){
  keepAlive(on);
  try{
    if(on&&!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}
    else if(!on&&wakeLock){const w=wakeLock;wakeLock=null;await w.release();}
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(busy&&document.visibilityState==='visible')keepAwake(true);});
async function convert(){
  if(!P||busy)return;
  busy=true;cancelled=false;outBlob=null;resetCounters();ui('busy');keepAwake(true);
  let vc=null,vErr=null;
  try{
    const fps=30,qa=20,qv=22;
    const W=P.W,H=P.H,ew=W+(W&1),eh=H+(H&1);
    const pal=PAL;
    vc=await pickVideoConfig(ew,eh,fps,forceSoft);
    if(!vc)throw new Error('متصفحك لا يوفّر ترميز الفيديو (H.264 أو VP9). جرّب Chrome أو Edge على الحاسوب.');
    const ow=vc.ow,oh=vc.oh,S=ow/ew;
    let audioSrc=null,audioCfg=null;
    if(P.audio){
      setProgress(0,'تحسين الصوت');await sleep(30);
      const ip=await innerPcm(x=>setProgress(ENH_SHARE*x,'تحسين الصوت'));audioSrc={chans:[ip.pcm],rate:P.audio.rate,len:ip.len};
      audioCfg=await pickAudioConfig(1,audioSrc.rate);
    }
    const target=new Mp4Muxer.ArrayBufferTarget();
    const muxer=new Mp4Muxer.Muxer({target,fastStart:'in-memory',firstTimestampBehavior:'cross-track-offset',
      video:{codec:vc.muxCodec,width:ow,height:oh},
      ...(audioCfg?{audio:{codec:'aac',numberOfChannels:audioCfg.channels,sampleRate:audioCfg.sr}}:{})});
    const venc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>{vErr=e;}});
    venc.configure(vc.cfg);

    const fb=newFb(W,H,P.bpp);
    const cv=document.createElement('canvas');cv.width=ew;cv.height=eh;
    const ctx=cv.getContext('2d',{willReadFrequently:false});
    const img=ctx.createImageData(ew,eh);new Uint32Array(img.data.buffer).fill(0xFFFFFFFF);
    view.width=ew;view.height=eh;
    let cvOut=cv;
    if(ow!==ew||oh!==eh){cvOut=document.createElement('canvas');cvOut.width=ow;cvOut.height=oh;}
    const ctxOut=cvOut!==cv?cvOut.getContext('2d'):null;
    if(ctxOut){ctxOut.imageSmoothingEnabled=true;ctxOut.imageSmoothingQuality='high';}

    const endMs=P.duration+500,beat=1000;
    let vP=0,aP=0,aErr=null;
    const base=audioSrc?ENH_SHARE:0,showP=m=>setProgress(base+(1-base)*(audioSrc?0.88*vP+0.12*aP:vP),m);
    /* the audio is encoded while the video encoder works */
    const aJob=audioSrc?encodeAudio(audioSrc,audioCfg,muxer,x=>{aP=x;}).catch(e=>{aErr=e;}):null;
    let emitted=0,lastKey=-1e9,lastT=-1,dirty=true;
    const emit=async(t)=>{
      t=Math.max(t,lastT+1);lastT=t;
      if(dirty){drawFb(cv,ctx,fb,pal,W,H,img);if(ctxOut)ctxOut.drawImage(cv,0,0,ow,oh);dirty=false;}
      const vf=new VideoFrame(cvOut,{timestamp:Math.round(t*1000),duration:33000});
      const key=emitted===0||t-lastKey>=6000;
      if(key)lastKey=t;
      venc.encode(vf,vc.mode==='quantizer'?{keyFrame:key,avc:{quantizer:qa},vp9:{quantizer:qv}}:{keyFrame:key});vf.close();
      emitted++;
      if(emitted%12===0)vctx.drawImage(cv,0,0);
      await drain(venc,24);
    };
    // every screen update becomes a frame at its own recorded time; a frame is repeated at least once a second so seeking stays accurate
    let i=0;
    while(i<P.ups.length){
      if(cancelled)break;
      if(vErr)throw vErr;
      const t=P.ups[i].ts;
      while(i<P.ups.length&&P.ups[i].ts<=t+40){applyUpdate(fb,W,H,P.ups[i]);i++;dirty=true;}
      while(emitted&&t-lastT>beat*1.5)await emit(lastT+beat);
      await emit(t);
      if(i%40===0){vP=Math.min(t/endMs,1);showP('الصورة · '+fmtTime(t)+' / '+fmtTime(P.duration));await sleep(0);}
    }
    await emit(endMs);
    vP=1;showP(WAIT);
    vctx.drawImage(cv,0,0);
    await venc.flush();venc.close();
    if(vErr)throw vErr;
    if(cancelled){if(aJob)await aJob;throw new Error('أُلغي التحويل.');}

    if(aJob){
      vP=1;showP(WAIT);
      await aJob;
      if(aErr)throw aErr;
      if(cancelled)throw new Error('أُلغي التحويل.');
    }
    showP(WAIT);await yieldNow();
    muxer.finalize();
    outBlob=new Blob([target.buffer],{type:'video/mp4'});
    const size=fmtSize(outBlob.size),vp9=vc.muxCodec==='vp9';
    // counters back to zero and the loaded lecture released, so the next one starts clean
    busy=false;releaseFile();setProgress(0,'');
    $('file').value='';
    $('fileCard').hidden=true;$('drop').classList.remove('has');$('dropText').textContent=DROP_DEFAULT;
    ui('done');
    $('outSize').textContent=size;
  }catch(e){
    if(vc&&vc.hw&&vErr&&!cancelled){busy=false;keepAwake(false);forceSoft=true;return await convert();}
    busy=false;outBlob=null;
    $('convErr').textContent=e.message||String(e);$('convErr').hidden=false;
    setProgress(0,'');
    ui(P?'ready':'empty');
  }finally{
    busy=false;keepAwake(false);
  }
}
$('go').addEventListener('click',convert);
$('cancel').addEventListener('click',()=>{cancelled=true;});

/* ---------- saving: a normal browser download; inside claude.ai the viewer confirms through the downloads capability ---------- */
$('save').addEventListener('click',async()=>{
  const msg=$('saveMsg');msg.textContent='';
  if(!outBlob||busy)return;
  const name=fileName+'.mp4';
  let dl=null;
  try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads');}catch(e){}
  if(dl){
    try{await dl.save({filename:name,data:outBlob});msg.textContent='· تم الحفظ';}
    catch(e){msg.textContent=e&&e.code==='declined'?'':'· تعذر الحفظ';}
    return;
  }
  const url=URL.createObjectURL(outBlob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  msg.textContent='· '+name;
});
})();
